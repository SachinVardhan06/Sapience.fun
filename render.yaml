services:
  - type: web
    name: sapience-fun
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: sapience-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - sapience.fun
